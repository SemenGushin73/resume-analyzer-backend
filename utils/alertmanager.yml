global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'  # SMTP-сервер (для Gmail)
  smtp_from: 'your-email@gmail.com'     # Email отправителя
  smtp_auth_username: 'your-email@gmail.com'  # Логин для SMTP
  smtp_auth_password: 'your-email-password'   # Пароль для SMTP
  smtp_require_tls: true                      # Использовать TLS

route:
  receiver: 'email'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - match:
        severity: 'critical'
      receiver: 'email'

receivers:
  - name: 'email'
    email_configs:
      - to: 'recipient-email@example.com'  # Email получателя
        send_resolved: true