global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'resume-analyzer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]

  - job_name: 'resume-generator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8082' ]

  - job_name: 'deepseek-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:9090' ]

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8765' ]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']  # Адрес AlertManager

rule_files:
  - "alert.rules.yml"