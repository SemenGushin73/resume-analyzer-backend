spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: deepseek-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.example.kafkadto.dto.AnalysisRequest
        spring.json.trusted.packages: 'com.example.kafkadto.dto'
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages: com.example.kafkadto.dto

#Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true