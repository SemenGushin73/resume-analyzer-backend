spring:
  application:
    name: deepseek-service
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.request.size: 52428800
    consumer:
      group-id: deepseek-group-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        fetch.max.bytes: 52428800
        spring.json.value.default.type: ru.kata.project.kafka.AnalysisRequest
        spring.json.trusted.packages: ru.kata.project.kafka

openrouter:
  api-key: ${OPENROUTER_API_KEY}
  model-name: deepseek/deepseek-r1-distill-llama-70b:free

server:
  port: 0