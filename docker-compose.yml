version: '2.4'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    mem_limit: 512m
    cpus: 0.5

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:7.4.2
    container_name: redis-container
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --requirepass root
    mem_limit: 256m
    cpus: 0.25

  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "21810:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    mem_limit: 256m
    cpus: 0.25

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    mem_limit: 1g
    cpus: 1.0

  resume-analyzer:
    image: resume-analyzer
    container_name: resume-analyzer
    build:
      context: .
      dockerfile: resume-analyzer/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker

  resume-generator:
    image: resume-generator
    container_name: resume-generator
    build:
      context: .
      dockerfile: resume-generator/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - mongodb
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker

  deepseek-service:
    image: deepseek-service
    container_name: deepseek-service
    build:
      context: .
      dockerfile: deepseek-service/Dockerfile
    ports:
      - "9090:9090"
    depends_on:
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVER: kafka:9092

  api-gateway:
    image: api-gateway
    container_name: api-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8765:8765"
    depends_on:
      - resume-analyzer
      - resume-generator
      - deepseek-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
