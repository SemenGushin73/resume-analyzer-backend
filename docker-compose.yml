version: '2.4'

services:

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/datasources/grafana.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=accessControlOnCall lokiLogsDataplane
      - GF_INSTALL_PLUGINS=https://storage.googleapis.com/integration-artifacts/grafana-lokiexplore-app/grafana-lokiexplore-app-latest.zip;grafana-lokiexplore-app

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    ports:
      - "9080:9080"
    volumes:
      - ./config/promtail/promtail.yaml:/etc/promtail/docker-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/docker-config.yaml
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/alertmanager/alert.rules.yml:/etc/prometheus/alert.rules.yml
    depends_on:
      - resume-analyzer
      - resume-generator
      - api-gateway

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/config.yml
      - ./smtp-password.txt:/etc/alertmanager/smtp-password.txt
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    depends_on:
      - prometheus

  postgres:
    image: postgres:15
    container_name: postgres
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    mem_limit: 512m
    cpus: 0.5

  mongodb:
    image: mongo:6
    container_name: mongodb
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    ports:
      - "27017:27017"
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:7.4.2
    container_name: redis-container
    restart: always
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --requirepass root
    mem_limit: 256m
    cpus: 0.25

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    ports:
      - "21810:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    mem_limit: 256m
    cpus: 0.25

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
        tag: "{{.Name}}"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    container_name: otel-collector
    command: [ "--config=/etc/otel-config.yaml" ]
    volumes:
      - ./config/otel-collector/otel-config.yml:/etc/otel-config.yaml
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8887:8887"
      - "8889:8889"
      - "13133:13133"
      - "55679:55679"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    ports:
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "6831:6831/udp"

  resume-analyzer:
    image: resume-analyzer
    container_name: resume-analyzer
    build:
      context: .
      dockerfile: resume-analyzer/Dockerfile
    ports:
      - "8083:8083"
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    depends_on:
      - config-server
      - otel-collector
      - postgres
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_SERVICE_NAME: "resume-analyzer"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_PROPAGATORS: "tracecontext,baggage,b3"
      OTEL_RESOURCE_ATTRIBUTES: "service.version=1.0,deployment.environment=production"
      OTEL_INSTRUMENTATION_KAFKA_ENABLED: "true"
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: "true"
      OTEL_INSTRUMENTATION_LOGBACK_ENABLED: "true"
      OTEL_INSTRUMENTATION_JVM_METRICS_ENABLED: "true"
      OTEL_INSTRUMENTATION_SYSTEM_METRICS_ENABLED: "true"
      OTEL_JAVAAGENT_DEBUG: "false"
      OTEL_LOG_LEVEL: "info"
      OTEL_METRIC_EXPORT_INTERVAL: 60000
      OTEL_BSP_SCHEDULE_DELAY: 5000
      OTEL_EXPERIMENTAL_CORRELATION_CONTEXT_ENABLED: "true"


  resume-generator:
    image: resume-generator
    container_name: resume-generator
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    build:
      context: .
      dockerfile: resume-generator/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - config-server
      - otel-collector
      - mongodb
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_SERVICE_NAME: "resume-generator"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_PROPAGATORS: "tracecontext,baggage,b3"
      OTEL_RESOURCE_ATTRIBUTES: "service.version=1.0,deployment.environment=production"
      OTEL_INSTRUMENTATION_KAFKA_ENABLED: "true"
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: "true"
      OTEL_INSTRUMENTATION_LOGBACK_ENABLED: "true"
      OTEL_INSTRUMENTATION_JVM_METRICS_ENABLED: "true"
      OTEL_INSTRUMENTATION_SYSTEM_METRICS_ENABLED: "true"
      OTEL_LOG_LEVEL: "info"
      OTEL_METRIC_EXPORT_INTERVAL: 60000
      OTEL_BSP_SCHEDULE_DELAY: 5000
      OTEL_EXPERIMENTAL_CORRELATION_CONTEXT_ENABLED: "true"

  api-gateway:
    image: api-gateway
    container_name: api-gateway
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8765:8765"
    depends_on:
      - config-server
      - otel-collector
      - resume-analyzer
      - resume-generator

    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_SERVICE_NAME: "api-gateway"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_PROPAGATORS: "tracecontext,baggage,b3"
      OTEL_RESOURCE_ATTRIBUTES: "service.version=1.0,deployment.environment=production"
      OTEL_INSTRUMENTATION_KAFKA_ENABLED: "true"
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: "true"
      OTEL_INSTRUMENTATION_LOGBACK_ENABLED: "true"
      OTEL_INSTRUMENTATION_JVM_METRICS_ENABLED: "true"
      OTEL_INSTRUMENTATION_SYSTEM_METRICS_ENABLED: "true"
      OTEL_JAVAAGENT_DEBUG: "false"
      OTEL_LOG_LEVEL: "info"
      OTEL_METRIC_EXPORT_INTERVAL: 60000
      OTEL_BSP_SCHEDULE_DELAY: 5000
      OTEL_EXPERIMENTAL_CORRELATION_CONTEXT_ENABLED: "true"

  config-server:
    image: config-server
    container_name: config-server
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    build:
      context: ./bitbucket-config-server
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME=${GIT_USER}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD=${GIT_PASS}

