spring:
  config:
    import: "optional:configserver:"
  application:
    name: support-chatbot-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
    compatibility-verifier:
      enabled: false
deepseek:
  api:
    url: "https://openrouter.ai/api/v1"
    key: ${DEEPSEEK_API_KEY}

  resilience4j:
    circuitbreaker:
      instances:
        deepseek:
          registerHealthIndicator: true
          failureRateThreshold: 50%
          minimumNumberOfCalls: 5
          waitDurationInOpenState: 10s
          slidingWindowType: COUNT_BASED
          slidingWindowSize: 10

faq:
  answers:
    # Общие вопросы
    "Как начать анализ резюме?": "Загрузите ваше резюме в формате PDF или DOCX, и система автоматически проведёт анализ"
    "Какие форматы резюме поддерживаются?": "Мы поддерживаем PDF, DOCX и TXT форматы"

    # Вопросы по улучшению
    "Как улучшить моё резюме?": """
      1. Укажите конкретные достижения с цифрами
      2. Используйте ключевые слова из вакансии
      3. Соблюдайте четкую структуру
      4. Держите объем 1-2 страницы"""

    # Технические вопросы
    "Система не загружает резюме": """
      1. Проверьте формат файла
      2. Убедитесь, что размер не превышает 5MB
      3. Попробуйте другой браузер
      Если проблема осталась, свяжитесь с поддержкой"""

    # Вопросы по функционалу
    "Как сравнить резюме с вакансией?": "Загрузите резюме и текст вакансии, система покажет процент соответствия и даст рекомендации"

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  tracing:
    enabled: false
metrics:
  export:
    prometheus:
      enabled: true

redis:
  host: ${SPRING_REDIS_HOST:localhost}
  port: ${SPRING_REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 60000

otel:
  exporter.otlp.enabled: false