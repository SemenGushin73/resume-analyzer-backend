server:
  port: 8888

spring:
  application:
    name: bitbucket-config-server
  cloud:
    config:
      server:
        git:
          uri: https://gitpacket.kata.academy/scm/fit/resume-config-repo.git
          search-paths: '{application}'
          default-label: main
          force-pull: true

logging:
  level:
    root: INFO
    org.springframework.cloud: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%C{1.} [%-5level] %d{HH:mm:ss} - %msg%n"


