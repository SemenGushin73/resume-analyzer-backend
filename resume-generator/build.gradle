plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'ru.kata.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Kafka
	implementation 'org.springframework.kafka:spring-kafka:3.3.2'
	implementation 'org.apache.kafka:kafka-clients'

	// Swagger/OpenAPI
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.28'
	implementation 'io.springfox:springfox-boot-starter:3.0.0'

	// Jackson & JSON
	implementation 'com.fasterxml.jackson.core:jackson-core:2.18.1'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.1'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.16.0'

	// Persistence & DB
	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	implementation 'org.hibernate.orm:hibernate-core:6.6.3.Final'
	implementation 'org.postgresql:postgresql:42.7.4'
	testImplementation 'com.h2database:h2'

	// MongoDB test support
	testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo:3.4.0'
	implementation('com.sourcemuse.gradle.plugin:gradle-mongo-plugin:2.0.0') {
		exclude group: 'org.mongodb', module: 'mongo-java-driver'
	}

	// Networking
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'

	// Logging
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
	implementation 'com.github.loki4j:loki-logback-appender:1.6.0'

	// Monitoring
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Internal Modules
	implementation 'webapp.common:resume-analyzer-common:1.0.0'

	// Lombok
	implementation 'org.projectlombok:lombok:1.18.36'
	compileOnly 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Code quality
	implementation 'com.puppycrawl.tools:checkstyle:10.20.2'
}

tasks.named('test') {
	useJUnitPlatform()
}
