spring.application.name=resume-generator

server.servlet.context-path=/
server.port=8082
spring.data.mongodb.uri=mongodb://localhost:27017/ResumeGenerator
spring.data.mongodb.authentication-database=admin

#logging.level.org.springframework.http.converter=DEBUG
#logging.level.com.fasterxml.jackson.databind=DEBUG

# Настройки Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Настройки Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=generate-group
spring.kafka.consumer.properties.fetch.max.bytes=52428800

# Настройки Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.request.size=52428800

# Настройки Kafka Template
spring.kafka.template.default-topic=resume-generation-request

