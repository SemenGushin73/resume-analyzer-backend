spring:
  config:
    import:
      - optional:classpath:common-actuator.yml
      - optional:classpath:common-kafka.yml

  application:
    name: resume-generator

  data:
    mongodb:
      uri: mongodb://localhost:27017/ResumeGenerator

  kafka:
    consumer:
      group-id: generate-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        fetch.max.bytes: 52428800
        spring.json.trusted.packages: ru.kata.project.kafka
        spring.json.value.default.type: ru.kata.project.kafka.ResumeRequestDTO

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.request.size: 52428800

    template:
      default-topic: resume-generation-request

server:
  port: 8082
