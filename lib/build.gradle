plugins {
    id("java-library")
    id("maven-publish")
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.springframework.boot' version '3.4.0'
    id 'checkstyle'
}
checkstyle {
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    toolVersion = "9.3"
    ignoreFailures = true
}

group = "ru.kata.project"
version = "0.0.1-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // Spring Core
    implementation("org.springframework:spring-context:6.1.6")
    implementation("org.springframework.boot:spring-boot-starter-aop:3.2.4")

    // Spring Ai
    implementation 'org.springframework.ai:spring-ai-starter-model-openai:1.0.0-M8'

    // Kafka
    implementation("org.springframework.kafka:spring-kafka:3.0.7")

    // SpringDoc OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Jackson (для сериализации DTO)
    api("com.fasterxml.jackson.core:jackson-databind:2.16.1")

    // Валидация (например, для @NotNull, @Size и т.д.)
    implementation("jakarta.validation:jakarta.validation-api:3.0.2")

    // Lombok
    compileOnly("org.projectlombok:lombok:1.18.32")
    annotationProcessor("org.projectlombok:lombok:1.18.32")

    // Testing dependencies
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.0")
    testImplementation("org.springframework.boot:spring-boot-starter-test:3.2.4")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'webapp.common'
            artifactId = 'resume-analyzer-common'
            version = '1.0.0'
        }
    }
}