spring:
  main:
    web-application-type: reactive
  application:
    name: notification-service
  config:
    import: "configserver:http://config-server:8888"
  cloud:
    config:
      uri: http://config-server:8888
      label: FIT-config-repo
      fail-fast: false
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 10

server:
  port: 8885






