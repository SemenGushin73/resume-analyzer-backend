global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'resume-analyzer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'resume-analyzer:8083' ]

  - job_name: 'resume-generator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'resume-generator:8082' ]

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'api-gateway:8765' ]

  #- job_name: 'subscription-service'
  #  metrics_path: '/actuator/prometheus'
  #  static_configs:
  #    - targets: [ 'subscription-service:8086' ] # Раскоментировать когда сервис заработает

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ 'alertmanager:9093' ]  # Адрес AlertManager

rule_files:
  - "/etc/prometheus/alert.rules.yml"